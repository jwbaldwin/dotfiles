# Spaceman configuration.
version = 1

[settings]
single_window_max_width = 1680
hud_style = "layouts"

[settings.gaps]
inner = 12
top = 12
bottom = 12
left = 12
right = 12

[[rules]]
bundle_id = "company.thebrowser.Browser"
action = "route"
workspace = 1

[[rules]]
bundle_id = "com.apple.MobileSMS"
action = "route"
workspace = 1

[[rules]]
bundle_id = "com.superlogical.rex"
action = "route"
workspace = 2

[[rules]]
bundle_id = "com.t3tools.t3code"
action = "route"
workspace = 3

[[rules]]
bundle_id = "com.apple.finder"
action = "float"

[[rules]]
bundle_id = "com.apple.Preview"
action = "float"

[[rules]]
bundle_id = "io.tailscale.ipn.macos"
action = "float"
